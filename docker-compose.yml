# ==============================================================================
# docker-compose.yml — Production Deployment for FastAPI + SQLite WAL Backend
# (Host Caddy proxies 127.0.0.1:8000 -> backend:8000)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronomed-backend
    restart: unless-stopped

    # Run as explicit UID:GID 10001:10001 matching the host ./data/sqlite owner
    user: "10001:10001"

    # Bind ONLY to host loopback (127.0.0.1) so FastAPI is never exposed directly
    # to the public internet; only Host Caddy on the same machine can reach it.
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - SQLITE_DB_PATH=/app/data/medical_scheduler.db
      - SQLITE_ECHO=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=720

    # Mount host directory for persistent SQLite .db, .db-wal, and .db-shm storage
    volumes:
      - ./data/sqlite:/app/data:rw
      - ./scripts:/app/scripts:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
